name: Weekly directory snippet check

# Phase 2 ownership verification, re-run weekly rather than only at submission.
# Same pattern as policy-hash-check.yml: cheap crawl, then a GitHub issue that
# doubles as the human review queue.
#
# The script flags. It does not delist, ban, or hide anything — that decision
# belongs to a person, and the traceability check fails the build if the script
# ever grows that ability.

on:
  schedule:
    # Thursdays 07:23 UTC, offset from the Monday policy-hash run.
    - cron: '23 7 * * 4'
  workflow_dispatch:
    inputs:
      only:
        description: 'Restrict to one listing id or URL (optional)'
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Re-check every verification snippet
        id: snippets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="--only=${{ github.event.inputs.only }}"; fi
          npm run check:snippets --silent -- $ARGS 2>&1 | tee /tmp/snippet-report.txt

      - name: Open an issue for listings needing human review
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const report = fs.readFileSync('/tmp/snippet-report.txt', 'utf8')

            if (/SKIPPED/.test(report)) {
              core.info('Supabase secrets are not configured — nothing to review.')
              return
            }

            const match = report.match(/listings needing human review: (.+)/)
            const names = match ? match[1].trim() : 'none'

            if (!names || names === 'none') {
              core.info('Every snippet confirmed. No review needed.')
              return
            }

            const date = new Date().toISOString().slice(0, 10)
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Snippet check: human review needed (${date})`,
              labels: ['snippet-review'],
              body: [
                'The weekly snippet re-check flagged these listings:',
                '',
                ...names.split(', ').map((n) => `- [ ] ${n}`),
                '',
                '**Nothing has been delisted.** The bot only flags. Read the check log,',
                'decide whether the change looks innocent (redesign, CMS migration, caching)',
                'or deliberate, and only then change the listing status by hand.',
                '',
                '<details><summary>Run output</summary>',
                '',
                '```',
                report.trim(),
                '```',
                '</details>',
              ].join('\n'),
            })
